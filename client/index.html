<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusHub · La vie du campus au même endroit</title>
    <meta name="description" content="Livres d'occasion, covoiturage, groupes d'étude et événements des clubs, réservés aux étudiants du campus." />
    <meta name="theme-color" content="#0049db" />
    <meta property="og:title" content="CampusHub" />
    <meta property="og:description" content="Toute la vie du campus, au même endroit." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before first paint so dark-mode users never see a white flash.
      try {
        var t = localStorage.getItem('campushub-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
