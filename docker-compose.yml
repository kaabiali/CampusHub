name: campushub

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # The healthcheck doubles as replica-set bootstrap: the member host is localhost:27017
    # so the API running on the host machine can connect with ?replicaSet=rs0.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

  ml:
    build: ./ml
    ports:
      - "5001:5001"
    environment:
      MONGO_URL: mongodb://mongo:27017/campushub?directConnection=true
    volumes:
      - ./ml/models:/app/models
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo-data:
