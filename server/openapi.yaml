openapi: 3.1.0
info:
  title: CampusHub API
  version: 1.0.0
  description: |
    API REST de CampusHub (Node.js, Express 5, MongoDB). Toutes les routes sont préfixées par /api.
    Authentification : cookie httpOnly campushub_token posé à la connexion (web), ou en-tête Authorization: Bearer (mobile).
    Les erreurs suivent toujours le format { error: { code, message, champs? } }, messages en français.
    Temps réel (Socket.io, même authentification) : message:send (avec accusé) et typing ; côté client message:new, messages:lus, notification:new, notifications:lues et typing.
servers:
  - url: /api
tags:
  - name: Système
  - name: Authentification
  - name: Profil
  - name: Livres
  - name: Modération
  - name: Covoiturage
  - name: Groupes
  - name: Événements
  - name: Administration
  - name: Messagerie
  - name: Notifications
  - name: Recommandations
paths:
  /health:
    get:
      tags: [Système]
      summary: "État de l’API, de MongoDB et du service ML"
      security: []
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
  /auth/inscription:
    post:
      tags: [Authentification]
      summary: "Créer un compte (adresse @campus.tn) et envoyer le lien de vérification"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Inscription' }
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /auth/google:
    post:
      tags: [Authentification]
      summary: "Se connecter ou créer un compte avec un compte Google vérifié"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleConnexion' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '503': { $ref: '#/components/responses/Erreur' }
  /auth/connexion:
    post:
      tags: [Authentification]
      summary: "Se connecter (pose le cookie de session)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connexion' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /auth/deconnexion:
    post:
      tags: [Authentification]
      summary: "Se déconnecter (efface le cookie)"
      security: []
      responses:
        '204': { description: Effectué }
        '400': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /auth/moi:
    get:
      tags: [Authentification]
      summary: "Utilisateur courant, ou null pour un visiteur"
      security: []
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
  /auth/verifier:
    post:
      tags: [Authentification]
      summary: "Confirmer l’adresse e-mail avec le jeton reçu"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Jeton' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /auth/renvoyer-verification:
    post:
      tags: [Authentification]
      summary: "Renvoyer le lien de vérification"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /auth/mot-de-passe-oublie:
    post:
      tags: [Authentification]
      summary: "Demander un lien de réinitialisation (réponse identique si le compte n’existe pas)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Email' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /auth/reinitialiser:
    post:
      tags: [Authentification]
      summary: "Choisir un nouveau mot de passe avec le jeton reçu"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reinitialisation' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /utilisateurs/moi:
    patch:
      tags: [Profil]
      summary: "Modifier son profil (filière, niveau, matières, centres d’intérêt)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profil' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /utilisateurs/moi/photo:
    post:
      tags: [Profil]
      summary: "Changer la photo de profil (multipart, champ photo, 5 Mo)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { photo: { type: string, format: binary } }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /utilisateurs/moi/mot-de-passe:
    patch:
      tags: [Profil]
      summary: "Changer son mot de passe (révoque les autres sessions)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangementMotDePasse' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /utilisateurs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    get:
      tags: [Profil]
      summary: "Profil public d’un étudiant"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
  /annonces/prix-conseille:
    get:
      tags: [Livres]
      summary: "Fourchette de prix conseillée (Random Forest, repli heuristique)"
      security: []
      parameters:
        - { name: matiere, in: query, schema: { type: string } }
        - { name: etat, in: query, schema: { type: string } }
        - { name: anneeEdition, in: query, schema: { type: integer } }
        - { name: prixNeuf, in: query, schema: { type: number } }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
  /annonces:
    get:
      tags: [Livres]
      summary: "Rechercher les annonces (filtres, tri, pagination)"
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categorie, in: query, schema: { type: string } }
        - { name: etat, in: query, schema: { type: string }, description: "Valeurs séparées par des virgules : NEUF,TRES_BON,BON,ACCEPTABLE" }
        - { name: prixMax, in: query, schema: { type: number } }
        - { name: vendeur, in: query, schema: { type: string }, description: "moi pour ses propres annonces" }
        - { name: tri, in: query, schema: { type: string }, description: "recent | prix_asc | prix_desc" }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
    post:
      tags: [Livres]
      summary: "Publier une annonce (multipart, jusqu’à 5 photos)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Annonce'
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /annonces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    get:
      tags: [Livres]
      summary: "Détail d’une annonce"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
    patch:
      tags: [Livres]
      summary: "Modifier une annonce (vendeur)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Annonce'
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
    delete:
      tags: [Livres]
      summary: "Supprimer une annonce et ses photos"
      responses:
        '204': { description: Effectué }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /annonces/{id}/statut:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    post:
      tags: [Livres]
      summary: "Marquer vendue ou remettre en vente"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatutAnnonce' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /categories:
    get:
      tags: [Livres]
      summary: "Lister les catégories"
      security: []
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
  /signalements:
    post:
      tags: [Modération]
      summary: "Signaler une annonce, un trajet, un événement ou un message reçu"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Signalement' }
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /trajets:
    get:
      tags: [Covoiturage]
      summary: "Rechercher les trajets à venir (départ, arrivée, date)"
      parameters:
        - { name: depart, in: query, schema: { type: string } }
        - { name: arrivee, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string }, description: "AAAA-MM-JJ (heure de Tunis)" }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
    post:
      tags: [Covoiturage]
      summary: "Proposer un trajet"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Trajet' }
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /trajets/mes-trajets:
    get:
      tags: [Covoiturage]
      summary: "Mes réservations et les trajets que je propose"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
  /trajets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    get:
      tags: [Covoiturage]
      summary: "Détail d’un trajet avec ses passagers"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
    patch:
      tags: [Covoiturage]
      summary: "Modifier un trajet (conducteur)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Trajet' }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /trajets/{id}/annuler:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    post:
      tags: [Covoiturage]
      summary: "Annuler un trajet (passagers prévenus)"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /trajets/{id}/reservations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    post:
      tags: [Covoiturage]
      summary: "Réserver des places (transaction, jamais de surréservation)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reservation' }
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /reservations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    delete:
      tags: [Covoiturage]
      summary: "Annuler sa réservation"
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /reservations/{id}/avis:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    post:
      tags: [Covoiturage]
      summary: "Noter le conducteur (dans les 7 jours suivant le départ)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Avis' }
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '409': { $ref: '#/components/responses/Erreur' }
  /geo/search:
    get:
      tags: [Covoiturage]
      summary: "Rechercher un lieu pour la carte (proxy Nominatim, mis en cache 7 jours)"
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 120 } }
      responses:
        '200':
          description: "Jusqu’à 5 lieux en Tunisie"
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultats:
                    type: array
                    items: { $ref: '#/components/schemas/LieuCarte' }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
        '502': { $ref: '#/components/responses/Erreur' }
        '504': { $ref: '#/components/responses/Erreur' }
  /geo/reverse:
    get:
      tags: [Covoiturage]
      summary: "Nommer un point de la carte (géocodage inverse)"
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: "Lieu le plus proche du point"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LieuCarte' }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
        '502': { $ref: '#/components/responses/Erreur' }
        '504': { $ref: '#/components/responses/Erreur' }
  /geo/itineraire:
    get:
      tags: [Covoiturage]
      summary: "Estimer la durée et la distance d’un trajet (itinéraire routier, sinon estimation)"
      description: "Fournir soit les deux adresses (`depart`, `arrivee`), soit les quatre coordonnées."
      parameters:
        - { name: depart, in: query, required: false, schema: { type: string, minLength: 3, maxLength: 120 } }
        - { name: arrivee, in: query, required: false, schema: { type: string, minLength: 3, maxLength: 120 } }
        - { name: departLat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: departLng, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: arriveeLat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: arriveeLng, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: "Durée et distance estimées pour le trajet"
          content:
            application/json:
              schema:
                type: object
                properties:
                  dureeMinutes: { type: integer, example: 24, description: "Entre 5 et 240 minutes" }
                  distanceKm: { type: number, example: 11.2 }
                  source: { type: string, enum: [route, estimation], description: "route = moteur d’itinéraire, estimation = repli hors ligne" }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
        '404': { $ref: '#/components/responses/Erreur' }
        '429': { $ref: '#/components/responses/Erreur' }
  /groupes:
    get:
      tags: [Groupes]
      summary: "Explorer les groupes d’étude"
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Erreur' }
        '403': { $ref: '#/components/responses/Erreur' }
    post:
      tags: [Groupes]
      summary: "Créer un groupe"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Groupe' }
      responses:
        '201': { description: Succès, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Erreur' }
        '401': { $ref: '#/components/responses/Erreur' }
