        '409': { $ref: '#/components/responses/Erreur' }
components:
  securitySchemes:
    cookie: { type: apiKey, in: cookie, name: campushub_token }
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Erreur:
      description: Erreur (message en français)
      content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } }
  schemas:
    Erreur:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: TRAJET_COMPLET }
            message: { type: string, example: "Ce trajet est complet." }
            champs: { type: object, additionalProperties: { type: string }, description: Erreurs par champ pour les formulaires }
    Inscription:
      type: object
      required: [prenom, nom, email, motDePasse]
      properties:
        prenom: { type: string }
        nom: { type: string }
        email: { type: string, format: email }
        motDePasse: { type: string, format: password }
        filiere: { type: string }
        niveau: { type: string }
    Connexion:
      type: object
      required: [email, motDePasse]
      properties:
        email: { type: string, format: email }
        motDePasse: { type: string, format: password }
    GoogleConnexion:
      type: object
      required: [credential]
      properties:
        credential: { type: string, description: "ID token renvoyé par Google Identity Services" }
    Jeton:
      type: object
      required: [jeton]
      properties:
        jeton: { type: string }
    Email:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Reinitialisation:
      type: object
      required: [jeton, motDePasse]
      properties:
        jeton: { type: string }
        motDePasse: { type: string, format: password }
    Profil:
      type: object
      properties:
        prenom: { type: string }
        nom: { type: string }
        filiere: { type: string }
        niveau: { type: string }
        matieres:
          type: array
          items: { type: string }
        centresInteret:
          type: array
          items: { type: string }
    ChangementMotDePasse:
      type: object
      required: [actuel, nouveau]
      properties:
        actuel: { type: string, format: password }
        nouveau: { type: string, format: password }
    Annonce:
      type: object
      required: [titre, categorie, matiere, etat, prix]
      properties:
        titre: { type: string }
        auteur: { type: string }
        categorie: { type: string }
        matiere: { type: string }
        etat: { type: string }
        anneeEdition: { type: integer }
        prixNeuf: { type: number }
        prix: { type: number }
        description: { type: string }
        conserver: { type: string }
        photos:
          type: array
          items: { type: string, format: binary }
    StatutAnnonce:
      type: object
      required: [statut]
      properties:
        statut: { type: string }
    Signalement:
      type: object
      required: [typeContenu, contenuId, motif]
      properties:
        typeContenu: { type: string }
        contenuId: { type: string }
        motif: { type: string }
    Trajet:
      type: object
      required: [lieuDepart, lieuArrivee, dateDepart, placesTotales, prix]
      properties:
        lieuDepart: { type: string }
        lieuArrivee: { type: string }
        coordDepart:
          description: "Position du départ sur la carte (null si non renseignée)."
          oneOf:
            - { $ref: '#/components/schemas/PointCarte' }
            - { type: 'null' }
        coordArrivee:
          description: "Position de l’arrivée sur la carte (null si non renseignée)."
          oneOf:
            - { $ref: '#/components/schemas/PointCarte' }
            - { type: 'null' }
        dateDepart: { type: string, format: date-time }
        dureeMinutes: { type: integer }
        placesTotales: { type: integer }
        prix: { type: number }
        vehicule: { type: string }
        details: { type: string }
    PointCarte:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    LieuCarte:
      type: object
      required: [label, lat, lng]
      properties:
        label: { type: string, description: "Libellé court affiché dans le formulaire" }
        detail: { type: string, description: "Adresse complète renvoyée par Nominatim" }
        lat: { type: number }
        lng: { type: number }
    Reservation:
      type: object
      properties:
        nbPlaces: { type: integer }
    Avis:
      type: object
      required: [note]
      properties:
        note: { type: integer }
        commentaire: { type: string }
    Groupe:
      type: object
      required: [nom, matiere]
      properties:
        nom: { type: string }
        matiere: { type: string }
        description: { type: string }
        capaciteMax: { type: integer }
    Seance:
      type: object
      required: [date, lieu, sujet]
      properties:
        date: { type: string, format: date-time }
        duree: { type: integer }
        lieu: { type: string }
        sujet: { type: string }
    Club:
      type: object
      required: [nom]
      properties:
        nom: { type: string }
        description: { type: string }
    Responsables:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          items: { type: string }
    Evenement:
      type: object
      required: [club, titre, lieu, dateDebut]
      properties:
        club: { type: string }
        titre: { type: string }
        description: { type: string }
        lieu: { type: string }
        dateDebut: { type: string, format: date-time }
        dateFin: { type: string, format: date-time }
        capacite: { type: integer }
        estPublic: { type: boolean }
    Message:
      type: object
      required: [contenu, clientId]
      properties:
        contenu: { type: string }
        clientId: { type: string }
        contexte: { type: object }
    Ids:
      type: object
      properties:
        ids:
          type: array
          items: { type: string }
    Blocage:
      type: object
      required: [bloque]
      properties:
        bloque: { type: boolean }
    Categorie:
      type: object
      required: [nom]
      properties:
        nom: { type: string }
        description: { type: string }
security:
  - cookie: []
  - bearer: []
