  /admin/signalements/{id}/traiter:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    post:
      tags: [Administration]
      summary: "Retirer le contenu signalé et clore ses signalements"
